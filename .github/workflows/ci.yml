name: CI

# Run once per PR; don't rerun the same commit after the PR is merged.
# Documentation-only changes do not need a Windows runner.
on:
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'start.bat'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Reuse compiled wheels between PRs, with faster parallel resolution
      # than reinstalling the entire Python environment through pip.
      - name: Set up uv (with dependency cache)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run behavior tests (mocked external APIs)
        run: python -m pytest -q tests/
